<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="56" viewBox="0 0 1000 56" role="img" aria-label="Let&#x27;s Connect">
<title>Let's Connect</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.55" stop-color="#1a1545"/><stop offset="1" stop-color="#0d3836"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3fb5aa"/></linearGradient><clipPath id="c"><rect width="1000" height="56" rx="12"/></clipPath></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{opacity:0;animation:in .7s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<g clip-path="url(#c)"><rect width="1000" height="56" fill="url(#bg)"/>
<rect width="6" height="56" fill="url(#acc)"/>
<rect y="52" width="1000" height="4" fill="url(#acc)" fill-opacity="0.45"/>
<rect y="52" width="160" height="4" fill="url(#acc)"><animate attributeName="x" from="-160" to="1000" dur="5s" repeatCount="indefinite"/></rect>
<text class="t" x="28" y="36" font-size="24" font-weight="700" fill="#f1f5f9">Let's Connect</text></g>
<rect x="0.5" y="0.5" width="999" height="55" rx="12" fill="none" stroke="#287A74" stroke-opacity="0.8"/>
</svg>