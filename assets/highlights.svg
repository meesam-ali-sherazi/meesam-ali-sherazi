<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="Highlights: 3 projects built, 1 internship, 6 frontend tools, 3 languages spoken">
<title>Highlights</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.55" stop-color="#1a1545"/><stop offset="1" stop-color="#0d3836"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3fb5aa"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.inner{opacity:0;animation:pop .7s ease-out forwards}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1s ease-out forwards}
@keyframes grow{to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
.bar{}
</style>
<g class="card" style="animation-delay:0.00s" transform="translate(0,0)"><g class="inner" style="animation-delay:0.00s">
<rect x="0" y="0" width="232" height="140" rx="14" fill="url(#bg)" stroke="#287A74" stroke-opacity="0.8"/>
<text x="20" y="62" font-size="48" font-weight="800" fill="url(#acc)">3</text>
<text x="20" y="92" font-size="16" font-weight="600" fill="#e2e8f0">Projects built</text>
<text x="20" y="114" font-size="12" fill="#94a3b8">Tracker, BioLab, e-commerce</text>
<rect class="bar" x="20" y="126" width="192" height="3" rx="1.5" fill="url(#acc)" style="animation-delay:0.40s"/></g></g>
<g class="card" style="animation-delay:0.15s" transform="translate(256,0)"><g class="inner" style="animation-delay:0.15s">
<rect x="0" y="0" width="232" height="140" rx="14" fill="url(#bg)" stroke="#287A74" stroke-opacity="0.8"/>
<text x="20" y="62" font-size="48" font-weight="800" fill="url(#acc)">1</text>
<text x="20" y="92" font-size="16" font-weight="600" fill="#e2e8f0">Internship</text>
<text x="20" y="114" font-size="12" fill="#94a3b8">IT Virtual House</text>
<rect class="bar" x="20" y="126" width="192" height="3" rx="1.5" fill="url(#acc)" style="animation-delay:0.55s"/></g></g>
<g class="card" style="animation-delay:0.30s" transform="translate(512,0)"><g class="inner" style="animation-delay:0.30s">
<rect x="0" y="0" width="232" height="140" rx="14" fill="url(#bg)" stroke="#287A74" stroke-opacity="0.8"/>
<text x="20" y="62" font-size="48" font-weight="800" fill="url(#acc)">6</text>
<text x="20" y="92" font-size="16" font-weight="600" fill="#e2e8f0">Frontend tools</text>
<text x="20" y="114" font-size="12" fill="#94a3b8">Web and UI tools</text>
<rect class="bar" x="20" y="126" width="192" height="3" rx="1.5" fill="url(#acc)" style="animation-delay:0.70s"/></g></g>
<g class="card" style="animation-delay:0.45s" transform="translate(768,0)"><g class="inner" style="animation-delay:0.45s">
<rect x="0" y="0" width="232" height="140" rx="14" fill="url(#bg)" stroke="#287A74" stroke-opacity="0.8"/>
<text x="20" y="62" font-size="48" font-weight="800" fill="url(#acc)">3</text>
<text x="20" y="92" font-size="16" font-weight="600" fill="#e2e8f0">Languages spoken</text>
<text x="20" y="114" font-size="12" fill="#94a3b8">Urdu, English, Punjabi</text>
<rect class="bar" x="20" y="126" width="192" height="3" rx="1.5" fill="url(#acc)" style="animation-delay:0.85s"/></g></g>
</svg>