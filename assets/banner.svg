<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Meesam Ali Sherazi, full stack developer. Tech: HTML, CSS, JavaScript, React, Python, Django, MySQL">
<title>Meesam Ali Sherazi, full stack developer</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.55" stop-color="#1a1545"/><stop offset="1" stop-color="#0d3836"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3fb5aa"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3fb5aa" stop-opacity="0.35"/><stop offset="1" stop-color="#3fb5aa" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.in{opacity:0;animation:rise .8s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.08);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="280" fill="url(#bg)"/>
<circle cx="850" cy="140" r="170" fill="url(#glow)" class="pulse"/>
<circle cx="850" cy="140" r="110" fill="none" stroke="#8b5cf6" stroke-opacity="0.35" class="pulse" style="animation-delay:.8s"/>
<circle cx="850" cy="140" r="150" fill="none" stroke="#3b82f6" stroke-opacity="0.25" class="pulse" style="animation-delay:1.6s"/>
<text class="float" x="850" y="190" text-anchor="middle" font-size="130" font-weight="700" fill="url(#acc)" fill-opacity="0.85">&lt;/&gt;</text>
<rect width="1000" height="5" fill="url(#acc)"/>
<rect y="0" width="180" height="5" fill="#ffffff" fill-opacity="0.55"><animate attributeName="x" from="-180" to="1000" dur="4s" repeatCount="indefinite"/></rect>
<text class="in" x="60" y="108" font-size="54" font-weight="800" fill="url(#acc)" style="animation-delay:.1s">Meesam Ali Sherazi</text>
<text class="in" x="60" y="152" font-size="26" font-weight="500" fill="#e2e8f0" style="animation-delay:.25s">Full stack developer</text>
<text class="in" x="60" y="184" font-size="16" fill="#94a3b8" style="animation-delay:.4s">Learning backend with Python and Django. Open to job opportunities.</text>
<g class="in" style="animation-delay:0.60s"><rect x="60" y="212" width="68" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#3fb5aa" stroke-opacity="0.7"/><text x="94.0" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">HTML</text></g>
<g class="in" style="animation-delay:0.72s"><rect x="140" y="212" width="58" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#3fb5aa" stroke-opacity="0.7"/><text x="169.0" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">CSS</text></g>
<g class="in" style="animation-delay:0.84s"><rect x="210" y="212" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#3fb5aa" stroke-opacity="0.7"/><text x="273.0" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">JavaScript</text></g>
<g class="in" style="animation-delay:0.96s"><rect x="348" y="212" width="78" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#3fb5aa" stroke-opacity="0.7"/><text x="387.0" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">React</text></g>
<g class="in" style="animation-delay:1.08s"><rect x="438" y="212" width="87" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#3fb5aa" stroke-opacity="0.7"/><text x="481.5" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Python</text></g>
<g class="in" style="animation-delay:1.20s"><rect x="537" y="212" width="87" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#3fb5aa" stroke-opacity="0.7"/><text x="580.5" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Django</text></g>
<g class="in" style="animation-delay:1.32s"><rect x="636" y="212" width="78" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#3fb5aa" stroke-opacity="0.7"/><text x="675.0" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">MySQL</text></g>
</g>
<rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#287A74" stroke-opacity="0.8"/>
</svg>